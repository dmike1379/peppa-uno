<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5EC4F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Peppa UNO">
  <link rel="apple-touch-icon" href="images/avatars/peppa.jpg">
  <link rel="manifest" href="manifest.json">
  <title>Peppa UNO 🐷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Set the skin before first paint so the page never flashes the other one.
    try { document.documentElement.dataset.skin = localStorage.getItem('pu_skin') || 'peppa'; } catch (e) {}
  </script>
</head>
<body class="lobby-page scene">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <div class="lobby-container">
    <header class="game-header">
      <img class="pig-icon" id="skinLogo" src="images/avatars/peppa.jpg" alt="Peppa" width="72" height="72">
      <h1 class="game-title"><span id="skinTitle">Peppa</span> <span class="uno-badge">UNO</span></h1>
    </header>
    <div class="skin-switch">
      <button class="skin-toggle" id="skinToggle" type="button">Switch skin</button>
    </div>

    <div class="lobby-card" id="setupPanel">
      <div class="step">
        <div class="step-title"><span class="step-num">1</span> What's your name?</div>
        <input type="text" id="playerName" placeholder="Linnea" maxlength="12" autocomplete="off" autocapitalize="words">
      </div>

      <div class="step">
        <div class="step-title"><span class="step-num">2</span> Pick your character</div>
        <div class="avatar-grid" id="avatarGrid"></div>
      </div>

      <div class="step" style="margin-bottom:0">
        <div class="step-title"><span class="step-num">3</span> Let's play!</div>
        <div class="lobby-buttons">
          <button class="btn btn-primary" id="createBtn" disabled>🐷 Start a new game</button>
          <div class="or-divider">or join with a code</div>
          <div class="join-row">
            <input type="text" id="roomInput" placeholder="CODE" maxlength="4" autocomplete="off" autocapitalize="characters">
            <button class="btn btn-secondary" id="joinBtn" disabled>Join</button>
          </div>
        </div>
      </div>
    </div>

    <div class="waiting-panel hidden" id="waitingPanel">
      <div class="waiting-card">
        <p class="waiting-label">Tell the other player this code:</p>
        <div class="room-code-big" id="displayCode"></div>
        <button class="btn btn-green" id="shareBtn">📲 Send invite</button>
        <p class="waiting-message">Waiting for player 2…</p>
        <div class="waiting-pig">🐷</div>
        <button class="btn btn-outline" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/lobby.js"></script>
</body>
</html>
